project:
  type: atelier
  resources:
    # Published verbatim so `curl -fsSL .../install.sh | bash` works.
    - install.sh
    # Published verbatim so `irm .../install.ps1 | iex` works.
    - install.ps1
    # Quarto copies only these globs, plus files it finds behind an `href` or
    # `src` in the rendered HTML. The manifest names its icons in JSON, which is
    # not scanned, so they are listed here. `assets/icons/icon.svg` is not: the
    # social-metadata filter emits it behind a `link[href]`, so the resource
    # scan finds it.
    - favicon.ico
    - site.webmanifest
    - assets/icons/*.png
    - assets/social/og-image.png

website:
  title: "Oboro"
  description: "An anonymisation layer between your files and a language model."
  # No trailing slash: Quarto builds the social image URL by concatenating this
  # with the leading-slash `image` path below, without normalising, so a
  # trailing slash would yield `/oboro//assets/...`.
  site-url: &site-url https://m.canouil.dev/oboro
  repo-url: "https://github.com/mcanouil/oboro"
  repo-subdir: docs
  favicon: favicon.ico
  # The leading slash marks a project-relative path, which Quarto resolves
  # against `site-url` and measures to fill the image width and height tags.
  image: /assets/social/og-image.png
  image-alt: "The Oboro social card: on a dark slate field faintly printed with a page of document text, the name Oboro above a gold rule, then two substitutions, 'Marie Lefevre' and '06 12 34 56 78', each joined by a double-headed gold arrow to a gold-outlined placeholder, '[[PERSON_1]]' and '[[PHONE_1]]', above the line 'An anonymisation layer between your files and a language model.'"
  navbar:
    title: "Oboro"
    left:
      # - href: index.qmd
      #   text: "{{< iconify octicon:home-16 aria-hidden='true' >}} Home"
      - href: quickstart.qmd
        text: "{{< iconify octicon:rocket-16 aria-hidden='true' >}} Quickstart"
      - href: docker.qmd
        text: "{{< iconify octicon:container-16 aria-hidden='true' >}} Docker"
      - href: reference.qmd
        text: "{{< iconify octicon:book-16 aria-hidden='true' >}} Reference"
      - href: how-it-works.qmd
        text: "{{< iconify octicon:gear-16 aria-hidden='true' >}} How it works"
      - href: changelog.qmd
        text: "{{< iconify octicon:history-16 aria-hidden='true' >}} Changelog"
        aria-label: "Changelog"
    right:
      - text: "{{< iconify octicon:mark-github-16 title='GitHub' label='GitHub' >}}"
        href: "#gitlink-widget"
        aria-label: GitHub repository
  sidebar:
    style: floating
    contents:
      - section: "Using Oboro"
        contents:
          - index.qmd
          - quickstart.qmd
          - docker.qmd
          - configuration.qmd
          - reference.qmd
          - shells.qmd
      - section: "Understanding it"
        contents:
          - how-it-works.qmd
          - confidentiality.qmd
          - limitations.qmd
      - section: "Contributing"
        contents:
          - development.qmd
      - changelog.qmd
  page-footer:
    left: |
      Powered by [{{< iconify simple-icons:quarto aria-hidden='true' >}} Quarto](https://quarto.org).
    center: |
      &copy; []{#current-year} [Mickaël Canouil](https://mickael.canouil.fr). [{{< iconify octicon:heart-fill-16 aria-hidden='true' >}} Sponsor](https://github.com/sponsors/mcanouil?o=esb).
    right: |
      Licence: [MIT](https://github.com/mcanouil/oboro?tab=MIT-1-ov-file#readme).

brand: _brand.yml

format:
  # Configure the extension format by name. Declaring `html` would replace
  # `atelier-html` rather than configure it, silently dropping the theme, the
  # bundled scripts, and the social-metadata filter.
  atelier-html:
    # Both lists are written out because a YAML anchor shared between them is
    # rejected by the schema check. The extension stylesheet is applied first,
    # so this one wins the cascade and can use its `body-mix()` and the
    # `$brand-*` variables generated from `_brand.yml`.
    theme:
      light:
        - brand
        - assets/theme.scss
      dark:
        - brand
        - assets/theme.scss
    include-after-body:
      - file: assets/scripts/placeholders.html

filters:
  - at: pre-quarto
    path: code-window
  - at: post-quarto
    path: gitlink

extensions:
  # Quarto keeps the `website` block out of the metadata it hands to Lua
  # filters, so the social-metadata filter cannot read `website.site-url` to
  # build `og:url` and the canonical link. The anchor above republishes the same
  # scalar here, without a second copy of the string.
  atelier:
    site-url: *site-url
    icon: assets/icons/icon.svg
    apple-touch-icon: assets/icons/apple-touch-icon.png
    manifest: site.webmanifest
    # `theme-color` is deliberately absent: atelier falls back per scheme to the
    # brand background, which is the colour the page is painted with and so the
    # tint the browser UI should take. Setting it here would only restate
    # `mist` and `nightfall` from `_brand.yml`.
  gitlink:
    # Widget only: the platform and repository come from `website.repo-url`,
    # and in-text reference rewriting stays off.
    enabled: false
    widget:
      enabled: true
      extra-links:
        - text: "Ideas"
          href: "/discussions/categories/feature-requests"
          icon: discussion
        - text: "Q&A"
          href: "/discussions/categories/q-a"
          icon: question
      sponsor: mcanouil
      style-navbar-tools: true
  code-window:
    style: "macos"
    # Blocks here are either a command to run or the output it produced, and
    # both are labelled explicitly, so a language-derived label would only add
    # noise.
    auto-filename: false
