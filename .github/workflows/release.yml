name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: "Version bump (applied when 'Create release' is ticked)"
        default: "minor"
        options:
          - "patch"
          - "minor"
          - "major"
      create_release:
        type: boolean
        description: "Bump versions, tag, and create a GitHub Release"
        default: true
      deploy_pages:
        type: boolean
        description: "Deploy documentation to GitHub Pages"
        default: true

permissions:
  contents: read

# Serialise releases and never cancel one in flight: aborting midway could
# leave the bump merged but the tag and release absent.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test before releasing
    if: ${{ inputs.create_release || inputs.deploy_pages }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Check formatting
        run: cargo fmt --all --check

      # The released artefacts are the default and ner builds, so both are
      # linted here. The ocr build needs the Tesseract system libraries and is
      # covered by the Check workflow rather than installed again for a release.
      - name: Lint the released builds
        run: |
          set -euo pipefail
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features ner -- -D warnings

      - name: Test
        run: cargo test --all-targets

  bump-version:
    name: Bump version
    needs: validate
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    outputs:
      version: ${{ steps.bump.outputs.version }}
      commit_sha: ${{ steps.land.outputs.sha }}

    steps:
      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}

      # The plugin pins itself to its version string, so a user is only
      # offered an update when it changes. The lock file follows the bump, or
      # the released tag builds a version that disagrees with its own manifest.
      - name: Bump the version
        id: bump
        uses: mcanouil/release-actions/bump@v1
        with:
          bump: ${{ inputs.version }}
          token: ${{ steps.token.outputs.token }}
          ecosystems: cargo, citation
          targets: |
            - file: .claude-plugin/plugin.json
              pattern: '^  "version": "{version}",$'

      # Skip CI on the squash-merged bump: the validate job already tests and
      # lints the tree before the release.
      - name: Land the bump
        id: land
        uses: mcanouil/release-actions/land@v1
        with:
          mode: pull-request
          files: ${{ steps.bump.outputs.files }}
          version: ${{ steps.bump.outputs.version }}
          message: "ci: bump version to ${{ steps.bump.outputs.version }} :rocket: [skip ci]"
          branch: ci/bump-version
          token: ${{ steps.token.outputs.token }}

  build-binaries:
    name: Build ${{ matrix.target }}${{ matrix.suffix }}
    needs: bump-version
    if: ${{ inputs.create_release }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      # Provenance is signed with a workflow identity, which needs both.
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # musl rather than glibc: a static binary runs on any distribution
          # whatever its glibc version, Alpine included.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            features: ""
            suffix: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            features: ""
            suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            features: ""
            suffix: ""
          # Windows ships the default build only: ONNX Runtime (ner) and
          # Tesseract (ocr) both stay source builds there.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: ""
            suffix: ""
          # The ner build links ONNX Runtime, whose prebuilt library is
          # glibc-only, so these are glibc targets rather than musl. The
          # Ubuntu runners are pinned to 24.04 rather than latest so the
          # binaries' documented glibc floor (2.39) cannot rise silently
          # when the alias repoints.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            features: ner
            suffix: -ner
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: ner
            suffix: -ner
          - os: macos-latest
            target: aarch64-apple-darwin
            features: ner
            suffix: -ner

    steps:
      - name: Checkout the bump commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.commit_sha }}

      - name: Install the pinned toolchain
        if: ${{ !endsWith(matrix.target, '-musl') }}
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      # The cache action does not key on cargo features, so without an
      # explicit key the default and ner jobs sharing a target would fight
      # over one cache entry.
      - uses: Swatinem/rust-cache@v2.9.2
        if: ${{ !endsWith(matrix.target, '-musl') }}
        with:
          key: ${{ matrix.features }}

      # The default build deliberately depends on nothing but Rust, which is
      # what makes a downloadable binary worth publishing. The ner build is
      # published too, as glibc archives, since ONNX Runtime has no musl
      # build. OCR needs the Tesseract shared libraries at run time, so it
      # stays a build-from-source choice.

      # musl is built inside Alpine, where it is the native target, rather
      # than cross-compiled from Debian. Debian's musl-gcc is a specs wrapper
      # that rejects the -m64 that cc-rs passes, so building SQLite's vendored
      # C sources fails outright. The runner is already the right
      # architecture, so the container is native too and nothing is emulated.
      # This mirrors the Dockerfile, which builds the same way.
      - name: Build release binary (musl, in Alpine)
        if: ${{ endsWith(matrix.target, '-musl') }}
        run: |
          set -euo pipefail
          docker run --rm -v "${PWD}":/src -w /src \
            rust:1-alpine@sha256:3c38f3f82c2f3d73da3b38e18d279393a04cb43ddded0e35088a8c3324d40900 sh -c '
            set -e
            apk add --no-cache musl-dev
            cargo build --release --locked
          '
          # The container builds as root, so hand the output back before the
          # remaining steps, which do not run as root, try to read it.
          sudo chown -R "$(id -u):$(id -g)" target
          mkdir -p "target/${{ matrix.target }}/release"
          mv target/release/oboro "target/${{ matrix.target }}/release/oboro"

      - name: Build release binary
        if: ${{ !endsWith(matrix.target, '-musl') }}
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.bump-version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release_assets
          tar -czf "release_assets/oboro-${VERSION}-${{ matrix.target }}${{ matrix.suffix }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" oboro

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.bump-version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path release_assets | Out-Null
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/oboro.exe" `
            -DestinationPath "release_assets/oboro-$env:VERSION-${{ matrix.target }}${{ matrix.suffix }}.zip"

      # Lets anyone run `gh attestation verify` and learn which workflow and
      # which commit produced the file in front of them. Two globs rather
      # than one: only one of them ever matches on a given runner, and the
      # action only fails when the combined match set is empty.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release_assets/*.tar.gz
            release_assets/*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}${{ matrix.suffix }}
          path: |
            release_assets/*.tar.gz
            release_assets/*.zip
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Create GitHub Release
    needs: [bump-version, build-binaries]
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      VERSION: ${{ needs.bump-version.outputs.version }}
      COMMIT_SHA: ${{ needs.bump-version.outputs.commit_sha }}

    steps:
      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}

      - name: Checkout the bump commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.commit_sha }}

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: release_assets

      # Generated here rather than per-architecture: a checksum file written
      # in the build job would only ever cover the one archive that job made.
      - name: Checksum every archive
        working-directory: release_assets
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      # The changelog says what changed; on its own it never says how to get
      # the thing. The template carries the install and verification steps,
      # and lives outside the workflow so the prose can be edited without
      # touching CI.
      - name: Compose the release body
        id: notes
        uses: mcanouil/release-actions/notes@v1
        with:
          version: ${{ env.VERSION }}
          header: .github/release-notes.md
          section-heading: ""

      - name: Create GitHub Release
        uses: mcanouil/release-actions/release@v1
        with:
          version: ${{ env.VERSION }}
          body-file: ${{ steps.notes.outputs.body-file }}
          target: ${{ env.COMMIT_SHA }}
          assets: |
            release_assets/*.tar.gz
            release_assets/*.zip
            release_assets/SHA256SUMS
          token: ${{ steps.token.outputs.token }}

  pages:
    name: Deploy documentation
    needs: [bump-version, github-release]
    # Runs even when only the docs are being republished, so `deploy_pages`
    # alone is a valid reason to dispatch this workflow.
    if: ${{ always() && inputs.deploy_pages && !failure() && !cancelled() }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      ref: ${{ needs.bump-version.outputs.commit_sha || github.ref }}
