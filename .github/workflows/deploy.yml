name: Deploy Documentation

# The site publishes only at a release (through the Release workflow's call
# below) or on a manual dispatch, not on every push to main. Pull requests
# still render it, so a broken page is caught before it lands.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit or ref to build (defaults to the latest version tag)."
        type: string
        required: false
        default: ""

# Only the deploy job of the shared workflow touches Pages.
permissions:
  contents: read

jobs:
  pages:
    name: Documentation
    uses: mcanouil/quarto-workflows/.github/workflows/pages.yml@v2
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      ref: ${{ inputs.ref }}

  lint-installer:
    name: Lint install.ps1
    # docs/install.ps1 only changes on a pull request; the workflow_call at
    # release time would otherwise spend a Windows runner minute re-linting a
    # file that has not moved.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft != true }}
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Invoke-ScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          # PSUseBOMForUnicodeEncodedFile is excluded on purpose. The file holds
          # one non-ASCII word, the author's name in the header, so the rule asks
          # for a byte order mark. This script is fetched over HTTP and run as a
          # string, and Invoke-RestMethod hands that mark back as a literal
          # U+FEFF: it welds onto the first `#`, the opening comment becomes an
          # unknown command, and the advertised one-liner stops working. The
          # step below is what holds the file to that, and it is the check that
          # matters here.
          $findings = Invoke-ScriptAnalyzer -Path docs/install.ps1 -Severity Warning -ExcludeRule PSUseBOMForUnicodeEncodedFile
          if ($findings) {
            $findings | Format-Table -AutoSize
            exit 1
          }

      # Lint alone passed the release that shipped an installer nobody could
      # run: the script was only ever loaded from disk, where Get-Content strips
      # a byte order mark, so the path every user takes went untested. This runs
      # it the way the documentation tells people to.
      - name: Run install.ps1 the way it is advertised
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Decoded from the bytes rather than read with Get-Content, which
          # strips a byte order mark and would hide exactly what broke before.
          $text = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes("docs/install.ps1"))
          if ($text[0] -eq [char]0xFEFF) {
            throw "docs/install.ps1 starts with a byte order mark; fetched with irm it becomes a literal U+FEFF and the advertised one-liner cannot run."
          }
          $installer = [scriptblock]::Create($text)

          # -Help exercises the parse and the parameters without touching the
          # network, which is the half that broke.
          & $installer -Help

          # A refusal has to arrive as its own message. Reading a property that
          # is not there is a terminating error under Set-StrictMode -Version
          # Latest, so an unguarded one in the error path would replace the
          # reason with a complaint about that property.
          $refusal = $null
          try { & $installer -Features ner } catch { $refusal = $_.Exception.Message }
          if ($refusal -notmatch 'Unsupported feature build') {
            throw "-Features ner should refuse in its own words; got: $refusal"
          }
